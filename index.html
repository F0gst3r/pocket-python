<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pocket Python</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161826">
<link rel="icon" href="icon-192.png">
<!-- iOS/iPadOS ignore the manifest icons for the home screen and use this one.
     It must be opaque: transparency is composited onto black. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Python">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<link rel="stylesheet" crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin="anonymous">
<!-- Phosphor is the design system's icon set. Served from jsdelivr because the
     service worker already caches that host, so offline keeps working. -->
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  /* ---------- Nocturne tokens ----------
     Values come from the design system (readme: --color-bg #161826,
     --color-text #e9e9ed, accent #9184d9) and the redesign artboard. Nothing
     below hard-codes a colour that is not a token. */
  :root{
    --color-bg:#161826;
    --color-bg-deep:#0f1018;
    --color-surface:#232532;
    --color-surface-2:#1b1d2c;
    --color-line:#292b31;
    --color-line-strong:#3f424d;

    --color-text:#e9e9ed;
    --color-text-2:#cfd3e5;
    --color-text-3:#b2b6ca;
    --color-muted:#9397ab;
    --color-muted-2:#75798c;
    --color-gutter:#595d6c;

    --color-accent:#9184d9;
    --color-accent-200:#e7e5fe;
    --color-accent-300:#d2cefd;
    --color-accent-400:#b5abfc;
    --color-accent-700:#5d5294;
    --color-accent-900:#2b2741;
    --color-accent-kicker:#9690c9;

    --color-err:#eba3ac;
    --paper:#1b1d2c;              /* холст черепахи — тоже тёмный */

    /* syntax */
    --syn-keyword:#b5abfc;
    --syn-module:#7fd1c4;
    --syn-fn:#8fc7f2;
    --syn-string:#dcbf82;
    --syn-number:#eba3ac;

    --font-body:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;

    --radius:8px;
    --radius-lg:14px;
    --shadow-md:0 6px 18px rgba(0,0,0,.55);
    --shadow-lg:0 16px 40px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    /* iOS Safari collapses percentage heights when its toolbars animate; dvh
       tracks the visible viewport, and -webkit-fill-available covers older iOS. */
    height:-webkit-fill-available;
    height:100dvh;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  body{
    background:var(--color-bg);
    color:var(--color-text);
    font-family:var(--font-body);
    font-size:13px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:fixed;
    inset:0;
    -webkit-tap-highlight-color:transparent;
  }
  button{touch-action:manipulation; font-family:var(--font-body);}
  /* The design system asks for a themed focus ring, never the browser default —
     but only on controls. A text-entry element matches :focus-visible whenever
     it is focused, whatever the input modality, so a blanket rule drew a box
     around the whole code area the moment the editor was tapped on iOS. */
  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible{outline:2px solid var(--color-accent); outline-offset:2px;}
  /* The editor indicates focus with its caret. */
  .CodeMirror [contenteditable]:focus,
  .CodeMirror [contenteditable]:focus-visible,
  .CodeMirror-code:focus,
  .CodeMirror-code:focus-visible,
  .CodeMirror-scroll:focus,
  .CodeMirror textarea:focus,
  .CodeMirror textarea:focus-visible{outline:none !important;}
  ::selection{background:var(--color-accent-900); color:var(--color-accent-200);}
  .ph, .ph-fill{line-height:1; flex-shrink:0;}

  /* ---------- toolbar ---------- */
  #toolbar{
    display:flex;
    align-items:center;
    gap:8.4px;
    padding:11.2px 16.8px;
    /* black-translucent status bar draws under the page on iOS standalone */
    padding-top:calc(11.2px + env(safe-area-inset-top));
    padding-left:calc(16.8px + env(safe-area-inset-left));
    padding-right:calc(16.8px + env(safe-area-inset-right));
    background:var(--color-bg);
    border-bottom:1px solid var(--color-line);
    flex-shrink:0;
  }
  #brand{display:flex; align-items:center; gap:8.4px; margin-right:16.8px;}
  #brand svg{display:block; flex-shrink:0;}
  .brand-name{font-size:14px; font-weight:500; letter-spacing:-0.01em; white-space:nowrap;}

  #filechip{
    display:flex;
    align-items:center;
    gap:5.6px;
    padding:0 11.2px;
    border-left:1px solid var(--color-line);
    border-right:1px solid var(--color-line);
    margin-right:auto;
    min-width:0;
  }
  #filechip .ph{font-size:15px; color:var(--color-muted-2);}
  #filename{
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--color-text-3);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #dirtydot{
    width:5px; height:5px; border-radius:50%;
    background:var(--color-accent);
    margin-left:2.8px;
    flex-shrink:0;
  }

  /* Outlined actions — the system never fills a primary button. */
  .btn{
    display:flex;
    align-items:center;
    gap:5.6px;
    background:transparent;
    border:1px solid var(--color-line-strong);
    color:var(--color-text-2);
    padding:6px 11.2px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s, background .15s, color .15s;
  }
  .btn .ph, .btn .ph-fill{font-size:15px;}
  .btn:hover{border-color:var(--color-accent-700); background:var(--color-accent-900);}
  .btn:active{background:var(--color-accent-900); border-color:var(--color-accent);}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn:disabled:hover{border-color:var(--color-line-strong); background:transparent;}

  .btn-icon{
    justify-content:center;
    width:31px; height:31px;
    padding:0;
    color:var(--color-muted);
  }
  .btn-icon:hover{color:var(--color-text-2);}

  .btn-ai{border-color:var(--color-accent-700); color:var(--color-accent-300);}
  .btn-ai:hover{border-color:var(--color-accent); background:var(--color-accent-900);}

  .btn-run{
    border-color:var(--color-accent);
    color:var(--color-accent-200);
    padding:6px 16.8px;
    box-shadow:0 0 18px rgba(145,132,217,.22);
  }
  .btn-run:hover{background:var(--color-accent-900); border-color:var(--color-accent-400);}
  .btn-run .ph-fill{font-size:14px;}

  #moreBtn{display:none;}
  /* display:flex below would otherwise beat the UA's [hidden]{display:none} */
  #moremenu[hidden]{display:none;}
  #moremenu{
    position:absolute;
    top:calc(52px + env(safe-area-inset-top));
    right:calc(12px + env(safe-area-inset-right));
    z-index:40;
    display:flex;
    flex-direction:column;
    gap:2.8px;
    padding:5.6px;
    background:var(--color-surface);
    border:1px solid var(--color-line-strong);
    border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
  }
  #moremenu button{
    display:flex; align-items:center; gap:8.4px;
    background:transparent; border:none;
    color:var(--color-text-2);
    font-size:13px; font-weight:500;
    padding:8px 11.2px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  #moremenu button:hover{background:var(--color-accent-900); color:var(--color-text);}
  #moremenu .ph{font-size:16px;}

  /* ---------- layout ---------- */
  #main{flex:1; display:flex; min-height:0;}
  #editor-pane{
    flex:1 1 58%;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:var(--color-bg);
    border-right:1px solid var(--color-line);
  }
  #editor-host{flex:1; min-height:0;}

  #statusbar{
    display:flex;
    align-items:center;
    gap:16.8px;
    padding:5.6px 16.8px;
    border-top:1px solid var(--color-line);
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--color-muted-2);
    flex-shrink:0;
  }
  #cursorpos{margin-left:auto;}

  /* ---------- CodeMirror, themed as Nocturne ---------- */
  .CodeMirror{
    height:100% !important;
    font-family:var(--font-mono) !important;
    font-size:14px;
    line-height:1.65;
    background:var(--color-bg) !important;
    color:var(--color-text) !important;
    padding-top:11.2px;
  }
  .CodeMirror-gutters{
    background:var(--color-bg) !important;
    border-right:none !important;
  }
  .CodeMirror-linenumber{color:var(--color-gutter) !important; padding:0 8.4px 0 5.6px;}
  /* Lines the AI rewrote get an accent bar left of the line number. */
  .pp-aigutter{width:12px;}
  .pp-ai-mark{
    width:3px;
    margin-left:5.6px;
    border-radius:2px;
    background:var(--color-accent);
    box-shadow:0 0 8px rgba(145,132,217,.55);
  }
  /* CodeMirror only hides the gutter's selection highlight, leaving the digits
     selectable. On touch devices the editor uses a contenteditable input, where
     the browser copies straight from the DOM — so «Выделить всё» + «Скопировать»
     put the line numbers into the clipboard, interleaved with the code. */
  .CodeMirror-gutters,
  .CodeMirror-gutter,
  .CodeMirror-gutter-wrapper,
  .CodeMirror-linenumber{
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
  }
  .CodeMirror-lines{padding-left:5.6px;}
  .CodeMirror-cursor{border-left:2px solid var(--color-accent-400) !important;}
  .cm-fixing .CodeMirror-cursor{border-left:2px solid var(--color-accent) !important;}
  .CodeMirror-selected{background:var(--color-accent-900) !important;}
  .CodeMirror-focused .CodeMirror-selected{background:var(--color-accent-900) !important;}
  .CodeMirror-activeline-background{background:rgba(43,39,65,.35) !important;}

  .cm-s-nocturne .cm-keyword{color:var(--syn-keyword);}
  .cm-s-nocturne .cm-builtin{color:var(--syn-fn);}
  .cm-s-nocturne .cm-def{color:var(--syn-fn);}
  .cm-s-nocturne .cm-property{color:var(--syn-fn);}
  .cm-s-nocturne .cm-variable{color:var(--color-text);}
  .cm-s-nocturne .cm-variable-2{color:var(--syn-module);}
  .cm-s-nocturne .cm-variable-3{color:var(--syn-module);}
  .cm-s-nocturne .cm-string,
  .cm-s-nocturne .cm-string-2{color:var(--syn-string);}
  .cm-s-nocturne .cm-number{color:var(--syn-number);}
  .cm-s-nocturne .cm-operator{color:var(--color-text-3);}
  .cm-s-nocturne .cm-comment{color:var(--color-muted-2); font-style:italic;}
  .cm-s-nocturne .cm-meta{color:var(--color-muted);}
  .cm-s-nocturne .cm-error{color:var(--color-err);}
  .cm-s-nocturne .cm-punctuation{color:var(--color-text-3);}

  .CodeMirror-hints{
    background:var(--color-surface) !important;
    border:1px solid var(--color-line-strong) !important;
    border-radius:var(--radius) !important;
    box-shadow:var(--shadow-lg) !important;
    font-family:var(--font-mono) !important;
    font-size:13px !important;
    padding:4px !important;
    z-index:50 !important;
  }
  .CodeMirror-hint{padding:5px 12px !important; color:var(--color-text-2) !important; border-radius:5px !important;}
  li.CodeMirror-hint-active{background:var(--color-accent-900) !important; color:var(--color-accent-200) !important;}

  /* ---------- right pane ---------- */
  #right-pane{
    flex:1 1 42%;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:var(--color-bg);
  }
  #tabs{
    display:flex;
    align-items:center;
    gap:8.4px;
    padding:11.2px 16.8px;
    flex-shrink:0;
  }
  .seg{display:flex; padding:2.8px; background:var(--color-surface); border-radius:var(--radius); gap:2.8px;}
  .seg-opt{
    display:flex;
    align-items:center;
    gap:5.6px;
    padding:5px 14px;
    border:none;
    border-radius:6px;
    background:transparent;
    color:var(--color-muted);
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    transition:color .15s, background .15s;
  }
  .seg-opt .ph, .seg-opt .ph-fill{font-size:14px;}
  .seg-opt:hover{color:var(--color-text);}
  .seg-opt.active{background:var(--color-accent-900); color:var(--color-text);}

  #clearBtn{margin-left:auto; width:28px; height:28px; color:var(--color-muted-2);}

  #console-wrap{
    flex:1;
    min-height:0;
    margin:0 16.8px 16.8px;
    background:var(--color-surface);
    border-radius:var(--radius);
    box-shadow:0 0 0 1px var(--color-line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  #console{
    flex:1;
    overflow-y:auto;
    padding:16.8px;
    font-family:var(--font-mono);
    font-size:13px;
    line-height:1.7;
    display:flex;
    flex-direction:column;
    gap:8.4px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #console > div{flex-shrink:0;}
  .line-out{color:var(--color-text);}
  .line-err{color:var(--color-err);}
  .line-sys{color:var(--color-muted-2);}
  .line-ok{color:var(--color-accent-400);}
  .line-sys, .line-ok, .line-err.has-icon{display:flex; gap:8.4px; align-items:flex-start;}
  .line-sys .ph, .line-ok .ph, .line-err .ph{font-size:14px; line-height:1.7;}
  .line-sys span, .line-ok span, .line-err span{white-space:pre-wrap; min-width:0;}

  .ai-block{
    margin-top:5.6px;
    padding:11.2px 14px;
    border-left:2px solid var(--color-accent);
    background:var(--color-accent-900);
    border-radius:0 var(--radius) var(--radius) 0;
    font-family:var(--font-body);
    font-size:13px;
    line-height:1.55;
    color:var(--color-accent-300);
    white-space:normal;
  }
  .ai-kicker{
    display:flex;
    align-items:center;
    gap:5.6px;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--color-accent-kicker);
    margin-bottom:5.6px;
  }
  .ai-kicker .ph{font-size:12px;}

  /* ---------- graphics ---------- */
  #graphics-wrap{
    flex:1;
    min-height:0;
    display:none;
    position:relative;
    background:var(--color-bg);
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:14px;
  }
  #graphics-wrap.active{display:flex;}
  #console-wrap.hidden{display:none;}
  canvas#tcanvas{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:0 0 0 1px var(--color-line), var(--shadow-md);
    touch-action:none;
    cursor:grab;
  }
  canvas#tcanvas:active{cursor:grabbing;}
  #zoom-controls{
    position:absolute;
    right:26px;
    bottom:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2.8px;
    background:rgba(35,37,50,.9);
    border:1px solid var(--color-line-strong);
    border-radius:var(--radius);
    padding:5.6px 4px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  #zoom-controls button{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:6px;
    background:transparent;
    color:var(--color-text-2);
    font-size:16px;
    cursor:pointer;
  }
  #zoom-controls button:hover{background:var(--color-accent-900);}
  #zoomReset{color:var(--color-muted-2) !important; font-size:15px !important;}
  #zoomLevel{font-family:var(--font-mono); font-size:10px; color:var(--color-muted-2);}

  /* ---------- key bar + mobile nav (hidden on desktop) ---------- */
  #keybar{display:none;}
  #mobilenav{display:none;}
  .kb{
    flex:0 0 auto;
    min-width:44px;
    height:44px;
    background:var(--color-surface);
    border:1px solid var(--color-line-strong);
    border-radius:var(--radius);
    color:var(--color-text);
    font-family:var(--font-mono);
    font-size:16px;
    cursor:pointer;
  }
  .kb:active{background:var(--color-accent-900); border-color:var(--color-accent-700);}
  .navbtn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2.8px;
    background:transparent;
    border:none;
    color:var(--color-muted);
    font-size:11px;
    font-weight:500;
    padding:6px 4px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .navbtn .ph, .navbtn .ph-fill{font-size:20px;}
  .navbtn.active{background:var(--color-accent-900); color:var(--color-accent-300);}

  /* ---------- iPhone (both orientations) and narrow iPad Split View ----------
     Width alone is not enough: an iPhone in landscape is ~850pt wide but only
     ~390pt tall, where a side-by-side split leaves no usable editor. ---------- */
  @media (max-width:700px), (max-height:500px){
    #toolbar{padding:8.4px 14px; padding-top:calc(8.4px + env(safe-area-inset-top)); gap:8.4px;}
    #brand{display:none;}
    #filechip{border-left:none; padding-left:0;}
    #openBtn, #saveBtn, #keyBtn{display:none;}
    #moreBtn{display:flex;}
    #moreBtn, #aicheck{width:32px; height:32px; padding:0; justify-content:center;}
    #aicheck .lbl{display:none;}
    #filechip{flex:1 1 auto; min-width:40px;}
    .btn-run{padding:6px 14px; flex:0 0 auto;}

    #editor-pane,#right-pane{width:100%; flex:1 1 auto; border-right:none;}
    #tabs{display:none;}
    #statusbar{display:none;}
    #console-wrap{margin:0; border-radius:0; box-shadow:none; background:var(--color-bg);}
    body:not(.view-code) #editor-pane{display:none;}
    body.view-code #right-pane{display:none;}

    /* 16px is the threshold below which iOS zooms the page on focus */
    .CodeMirror{font-size:16px;}
    #console{font-size:14px; padding:14px;}
    #graphics-wrap{padding:14px;}
    #zoom-controls{right:26px; bottom:26px;}

    #keybar{
      display:none;
      gap:5.6px;
      padding:8.4px 11.2px;
      background:var(--color-bg);
      border-top:1px solid var(--color-line);
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      flex-shrink:0;
    }
    #keybar::-webkit-scrollbar{display:none;}
    body.view-code #keybar{display:flex;}

    #mobilenav{
      display:flex;
      gap:5.6px;
      padding:8.4px 11.2px;
      padding-bottom:calc(8.4px + env(safe-area-inset-bottom));
      padding-left:calc(11.2px + env(safe-area-inset-left));
      padding-right:calc(11.2px + env(safe-area-inset-right));
      background:var(--color-bg);
      border-top:1px solid var(--color-line);
      flex-shrink:0;
    }
  }

  @media (max-height:500px){
    #toolbar{padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top)); gap:5px; flex-wrap:nowrap; overflow-x:auto;}
    .btn{padding:6px 10px; font-size:12.5px; flex:0 0 auto;}
    .kb{height:36px; min-width:38px; font-size:15px;}
    #keybar{padding:5px 10px;}
    .navbtn{flex-direction:row; gap:5.6px; padding:6px 4px; font-size:12.5px;}
    .navbtn .ph, .navbtn .ph-fill{font-size:16px;}
  }

  /* ---------- iPad portrait & landscape keep the split view ---------- */
  @media (min-width:701px) and (min-height:501px){
    #main{
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
      padding-bottom:env(safe-area-inset-bottom);
    }
  }
</style>
</head>
<body>

<header id="toolbar">
  <div id="brand">
    <svg width="22" height="22" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="118" fill="#2b2741"></rect><polyline points="152,152 152,256 256,256 256,360 360,360" fill="none" stroke="#b5abfc" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"></polyline><circle cx="360" cy="336" r="11" fill="#2b2741"></circle></svg>
    <span class="brand-name">Pocket Python</span>
  </div>

  <div id="filechip">
    <i class="ph ph-file-py" aria-hidden="true"></i>
    <span id="filename">program.py</span>

<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
// ---------- editor ----------
const WORDS = [
  "print(","input(","len(","range(","int(","float(","str(","list(","dict(","set(","tuple(",
  "for","while","if","elif","else","def","return","import","from","as","class","break","continue",
  "True","False","None","and","or","not","in","is","try","except","finally","with","lambda","pass",
  "turtle.forward(","turtle.backward(","turtle.left(","turtle.right(","turtle.penup(","turtle.pendown(",
  "turtle.goto(","turtle.color(","turtle.pencolor(","turtle.fillcolor(","turtle.pensize(","turtle.speed(",
  "turtle.circle(","turtle.begin_fill(","turtle.end_fill(","turtle.write(","turtle.home(","turtle.clear(",
  "turtle.bgcolor(","turtle.done()","turtle.Turtle()","turtle.Screen()",
  "Turtle()","forward(","backward(","left(","right(","penup(","pendown(","goto(","circle(","speed(",
  "range(","append(","abs(","sum(","min(","max(","sorted(","enumerate(","zip(","map(","filter("
];
function customHint(cm){
  const cur = cm.getCursor();
  const line = cm.getLine(cur.line);
  let start = cur.ch, end = cur.ch;
  while(start && /[\w.]/.test(line.charAt(start-1))) start--;
  const word = line.slice(start,end);
  if(!word) return null;
  const list = WORDS.filter(w=>w.startsWith(word) && w!==word);
  if(!list.length) return null;
  return {list, from: CodeMirror.Pos(cur.line,start), to: CodeMirror.Pos(cur.line,end)};
}

const editorTextarea = document.getElementById('editor');
editorTextarea.setAttribute('autocapitalize','off');
editorTextarea.setAttribute('autocorrect','off');
editorTextarea.setAttribute('autocomplete','off');
editorTextarea.setAttribute('spellcheck','false');

const cm = CodeMirror.fromTextArea(editorTextarea,{
  mode:'python',
  theme:'nocturne',          // themed in this file's <style>, not a CDN theme
  lineNumbers:true,
  indentUnit:4,
  tabSize:4,
  indentWithTabs:false,
  extraKeys:{"Ctrl-Space":"autocomplete"},
  // Order matters: the AI-change column is listed first, so it renders to the
  // left of the line numbers.
  gutters:['pp-aigutter','CodeMirror-linenumbers'],
});
// CodeMirror 5 switches to a contenteditable input on touch devices; iOS still
// applies autocapitalisation and smart quotes to it unless told otherwise.
(function(){
  const input = cm.getWrapperElement().querySelector('[contenteditable], textarea');
  if(input){
    input.setAttribute('autocapitalize','off');
    input.setAttribute('autocorrect','off');
    input.setAttribute('spellcheck','false');
  }
})();
// ---------- status chrome: filename, unsaved marker, caret position ----------
const filenameEl = document.getElementById('filename');
const dirtyDot = document.getElementById('dirtydot');
const cursorPosEl = document.getElementById('cursorpos');
let dirty = false;

function setFileName(name){ currentFileName = name; filenameEl.textContent = name; }
function setDirty(v){ dirty = v; dirtyDot.hidden = !v; }

cm.on('cursorActivity', function(){
  const c = cm.getCursor();
  cursorPosEl.textContent = 'Стр ' + (c.line + 1) + ', Кол ' + (c.ch + 1);
});
cm.on('change', function(){ if(!dirty) setDirty(true); });

// CodeMirror puts a zero-width space in the DOM of every empty line. Copying
// out of the editor on a touch device picks it up, and Python then rejects the
// pasted code with "invalid non-printable character U+200B". Strip those (and a
// stray BOM) whenever text arrives by paste.
cm.on('beforeChange', function(_cm, change){
  if(change.origin !== 'paste') return;
  const cleaned = change.text.map(l => l.replace(/[\u200B\u200C\u200D\uFEFF]/g, ''));
  if(cleaned.some((l, i) => l !== change.text[i])) change.update(change.from, change.to, cleaned);
});

cm.on('inputRead', function(cm, change){
  if(change.text[0] && /[\w.]/.test(change.text[0])){
    CodeMirror.showHint(cm, customHint, {completeSingle:false});
  }
});

// ---------- open / save ----------
const fileInput = document.getElementById('fileInput');
const openBtn = document.getElementById('openBtn');
const saveBtn = document.getElementById('saveBtn');
let currentFileName = 'program.py';

openBtn.onclick = () => fileInput.click();
fileInput.onchange = () => {
  const file = fileInput.files[0];
  if(!file) return;
  setFileName(file.name);
  const reader = new FileReader();
  reader.onload = () => {
    cm.setValue(reader.result);
    clearAiMarks();
    setDirty(false);
    logLine('Файл «'+file.name+'» загружен.','line-sys','ph ph-file-py');
  };
  reader.onerror = () => logLine('Не удалось прочитать файл.','line-err');
  reader.readAsText(file);
  fileInput.value = '';
};

saveBtn.onclick = () => {
  const blob = new Blob([cm.getValue()], {type:'text/x-python'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentFileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  setDirty(false);
};

// ---------- overflow menu (phones: Открыть/Сохранить live here) ----------
const moreBtn = document.getElementById('moreBtn');
const moreMenu = document.getElementById('moremenu');
function closeMore(){ moreMenu.hidden = true; moreBtn.setAttribute('aria-expanded','false'); }
moreBtn.onclick = (e) => {
  e.stopPropagation();
  const open = moreMenu.hidden;
  moreMenu.hidden = !open;
  moreBtn.setAttribute('aria-expanded', String(open));
};
moreMenu.onclick = (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  closeMore();
  if(btn.dataset.act === 'open') openBtn.click();
  else if(btn.dataset.act === 'save') saveBtn.click();
  else if(btn.dataset.act === 'key') askApiKey();
};
document.addEventListener('click', (e) => {
  if(!moreMenu.hidden && !moreMenu.contains(e.target)) closeMore();
});
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeMore(); });

// ---------- tabs ----------
const tabConsole = document.getElementById('tab-console');
const tabGraphics = document.getElementById('tab-graphics');
const consoleWrap = document.getElementById('console-wrap');
const graphicsWrap = document.getElementById('graphics-wrap');
function showTab(which){
  // Reveal the pane first: on phones #right-pane is display:none while the code
  // view is up, and measuring a hidden element collapses the canvas to its floor.
  syncMobileNav(which);
  closeMore();
  if(which==='console'){
    tabConsole.classList.add('active'); tabGraphics.classList.remove('active');
    consoleWrap.classList.remove('hidden'); graphicsWrap.classList.remove('active');
  } else {
    tabGraphics.classList.add('active'); tabConsole.classList.remove('active');
    consoleWrap.classList.add('hidden'); graphicsWrap.classList.add('active');
    resizeCanvas();
  }
}
tabConsole.onclick=()=>showTab('console');
tabGraphics.onclick=()=>showTab('graphics');

// ---------- console ----------
const consoleEl = document.getElementById('console');
// `icon` is a Phosphor class; program output passes none so it stays a plain
// pre-wrapped block rather than a flex row.
function logLine(text, cls, icon){
  const div = document.createElement('div');
  div.className = cls;
  if(icon){
    const ic = document.createElement('i');
    ic.className = icon;
    ic.setAttribute('aria-hidden','true');
    div.appendChild(ic);
    const span = document.createElement('span');
    span.textContent = text;
    div.appendChild(span);
    if(cls === 'line-err') div.classList.add('has-icon');
  } else {
    div.textContent = text;
  }
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
  return div;
}
function clearConsole(){ consoleEl.innerHTML=''; }
document.getElementById('clearBtn').onclick = () => { clearConsole(); cm.focus(); };

// ---------- turtle canvas engine (with pan & zoom) ----------
const canvas = document.getElementById('tcanvas');
const ctx = canvas.getContext('2d');
const zoomLevelEl = document.getElementById('zoomLevel');

let bg = '#1b1d2c';                 // --paper
let drawOps = [];              // recorded turtle-space draw operations, replayed on zoom/pan/resize
let scaleV = 1, offX = 0, offY = 0;
const MIN_SCALE = 0.15, MAX_SCALE = 10;

function worldToPx(x,y){ return [canvas.width/2 + offX + x*scaleV, canvas.height/2 + offY - y*scaleV]; }
function pxToWorld(px,py){ return [(px - canvas.width/2 - offX)/scaleV, -(py - canvas.height/2 - offY)/scaleV]; }
function updateTransform(){ ctx.setTransform(scaleV,0,0,-scaleV, canvas.width/2+offX, canvas.height/2+offY); }
function updateZoomLabel(){ if(zoomLevelEl) zoomLevelEl.textContent = Math.round(scaleV*100)+'%'; }

function niceGridStep(){
  const targetPx = 46;
  const raw = targetPx/scaleV;
  const steps = [1,2,5,10,20,50,100,200,500,1000,2000,5000,10000];
  for(const s of steps){ if(s>=raw) return s; }
  return steps[steps.length-1];
}

// The background is whatever bgcolor() was last given, so the grid and the
// default pen are derived from it rather than hard-coded: on the dark canvas
// they are light, and they flip back if a program sets a light background.
const probeCtx = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 1;
  return c.getContext('2d', {willReadFrequently:true});
})();
function isDarkColor(color){
  try{
    probeCtx.fillStyle = '#000000';
    probeCtx.fillStyle = color;        // an invalid value leaves the previous one
    probeCtx.fillRect(0,0,1,1);
    const d = probeCtx.getImageData(0,0,1,1).data;
    return (0.2126*d[0] + 0.7152*d[1] + 0.0722*d[2]) / 255 < 0.5;
  }catch(e){ return true; }
}
let inkIsLight = true;
function refreshInk(){ inkIsLight = isDarkColor(bg); }
// Colour a turtle uses when the program never set one — real turtle draws black,
// which would be invisible here.
window.turtleInk = function(){ return inkIsLight ? '#e9e9ed' : '#171220'; };

function drawGrid(){
  refreshInk();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  const step = niceGridStep();
  const [wx1,wy1] = pxToWorld(0,canvas.height);
  const [wx2,wy2] = pxToWorld(canvas.width,0);
  const startX = Math.floor(wx1/step)*step, endX = Math.ceil(wx2/step)*step;
  const startY = Math.floor(wy1/step)*step, endY = Math.ceil(wy2/step)*step;
  ctx.strokeStyle = inkIsLight ? 'rgba(233,233,237,0.07)' : 'rgba(23,18,32,0.09)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=startX; x<=endX; x+=step){ const [px] = worldToPx(x,0); ctx.moveTo(px+0.5,0); ctx.lineTo(px+0.5,canvas.height); }
  for(let y=startY; y<=endY; y+=step){ const py = worldToPx(0,y)[1]; ctx.moveTo(0,py+0.5); ctx.lineTo(canvas.width,py+0.5); }
  ctx.stroke();
  ctx.strokeStyle = inkIsLight ? 'rgba(233,233,237,0.22)' : 'rgba(23,18,32,0.25)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const ax = worldToPx(0,0)[0], ay = worldToPx(0,0)[1];
  ctx.moveTo(ax+0.5,0); ctx.lineTo(ax+0.5,canvas.height);
  ctx.moveTo(0,ay+0.5); ctx.lineTo(canvas.width,ay+0.5);
  ctx.stroke();
}

function drawWriteOp(op){
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  const [px,py] = worldToPx(op.x, op.y);
  ctx.fillStyle = op.color || window.turtleInk();
  ctx.font = Math.max(8, op.size*scaleV) + 'px sans-serif';
  ctx.fillText(op.text, px, py);
  ctx.restore();
}
function drawOp(op){
  if(op.type==='line'){
    ctx.strokeStyle=op.color || window.turtleInk(); ctx.lineWidth=op.width; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(op.x1,op.y1); ctx.lineTo(op.x2,op.y2); ctx.stroke();
  } else if(op.type==='dot'){
    ctx.fillStyle=op.color || window.turtleInk();
    ctx.beginPath(); ctx.arc(op.x,op.y,op.size/2,0,Math.PI*2); ctx.fill();
  } else if(op.type==='poly'){
    if(op.pts.length<2) return;
    ctx.fillStyle=op.color || window.turtleInk();
    ctx.beginPath();
    ctx.moveTo(op.pts[0][0],op.pts[0][1]);
    for(let i=1;i<op.pts.length;i++) ctx.lineTo(op.pts[i][0],op.pts[i][1]);
    ctx.closePath(); ctx.fill();
  } else if(op.type==='write'){
    drawWriteOp(op);
  }
}
function render(){
  drawGrid();
  updateTransform();
  for(const op of drawOps) drawOp(op);
  updateZoomLabel();
}

function resizeCanvas(){
  const w = graphicsWrap.clientWidth, h = graphicsWrap.clientHeight;
  if(!w || !h) return;              // pane is hidden — keep the current size
  const size = Math.max(200, Math.min(w,h) - 16);
  if(canvas.width !== size){ canvas.width = size; canvas.height = size; }
  render();
}
window.addEventListener('resize', resizeCanvas);

const DEFAULT_BG = '#1b1d2c';       // --paper
window.turtleClear = function(){ drawOps = []; scaleV=1; offX=0; offY=0; render(); };
// A run starts from a blank canvas: the previous program's drawing, its
// background and its zoom must not bleed into the next one.
window.turtleReset = function(){ bg = DEFAULT_BG; window.turtleClear(); };
window.turtleBg = function(color){ bg = color; render(); };
window.turtleLine = function(x1,y1,x2,y2,color,width){
  const op = {type:'line',x1,y1,x2,y2,color,width};
  drawOps.push(op); drawOp(op);
};
window.turtleDot = function(x,y,size,color){
  const op = {type:'dot',x,y,size,color};
  drawOps.push(op); drawOp(op);
};
window.turtlePolygon = function(pts,color){
  const op = {type:'poly',pts,color};
  drawOps.push(op); drawOp(op);
};
window.turtleWidth = function(){ return canvas.width; };
window.turtleHeight = function(){ return canvas.height; };
window.turtleWrite = function(x,y,text,color,size){
  const op = {type:'write',x,y,text,color,size};
  drawOps.push(op); drawOp(op);
};

// ---------- zoom & pan ----------
function zoomAt(px,py,factor){
  if(!isFinite(factor) || factor <= 0) return;
  const [wx,wy] = pxToWorld(px,py);
  scaleV = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scaleV*factor));
  offX = px - canvas.width/2 - wx*scaleV;
  offY = py - canvas.height/2 + wy*scaleV;
  render();
}
document.getElementById('zoomIn').onclick = () => zoomAt(canvas.width/2, canvas.height/2, 1.3);
document.getElementById('zoomOut').onclick = () => zoomAt(canvas.width/2, canvas.height/2, 1/1.3);
document.getElementById('zoomReset').onclick = () => { scaleV=1; offX=0; offY=0; render(); };

canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  zoomAt(e.clientX-rect.left, e.clientY-rect.top, factor);
}, {passive:false});

function touchDist(t1,t2){ const dx=t1.clientX-t2.clientX, dy=t1.clientY-t2.clientY; return Math.hypot(dx,dy); }
let touchState = null;
canvas.addEventListener('touchstart', (e)=>{
  const rect = canvas.getBoundingClientRect();
  if(e.touches.length===2){
    const [t1,t2] = e.touches;
    touchState = {mode:'pinch', dist: touchDist(t1,t2),
      midX:(t1.clientX+t2.clientX)/2-rect.left, midY:(t1.clientY+t2.clientY)/2-rect.top};
  } else if(e.touches.length===1){
    touchState = {mode:'pan', x:e.touches[0].clientX-rect.left, y:e.touches[0].clientY-rect.top};
  }
}, {passive:true});
canvas.addEventListener('touchmove', (e)=>{
  if(!touchState) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  if(touchState.mode==='pinch' && e.touches.length===2){
    const [t1,t2] = e.touches;
    const dist = touchDist(t1,t2);
    if(dist > 0 && touchState.dist > 0){
      zoomAt(touchState.midX, touchState.midY, dist/touchState.dist);
      touchState.dist = dist;
    }
  } else if(touchState.mode==='pan' && e.touches.length===1){
    const x = e.touches[0].clientX-rect.left, y = e.touches[0].clientY-rect.top;
    offX += x-touchState.x; offY += y-touchState.y;
    touchState.x = x; touchState.y = y;
    render();
  }
}, {passive:false});
canvas.addEventListener('touchend', ()=>{ touchState = null; });

let dragState = null;
canvas.addEventListener('mousedown', (e)=>{
  const rect = canvas.getBoundingClientRect();
  dragState = {x:e.clientX-rect.left, y:e.clientY-rect.top};
});
window.addEventListener('mousemove', (e)=>{
  if(!dragState) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX-rect.left, y = e.clientY-rect.top;
  offX += x-dragState.x; offY += y-dragState.y;
  dragState.x = x; dragState.y = y;
  render();
});
window.addEventListener('mouseup', ()=>{ dragState = null; });

// ---------- pyodide python turtle shim ----------
// bridge names must NOT start with a double underscore — inside a Python
// class body "__name" gets private-name-mangled to "_ClassName__name",
// which silently breaks js.__name(...) calls.
const TURTLE_SHIM = `
import js, math, time

_colormode = 1.0

def _tocss(c, *rest):
    """Accept "red", "#rrggbb", (r,g,b) and r,g,b — as the real turtle does."""
    if rest: c = (c,) + rest
    if isinstance(c, (tuple, list)):
        mx = _colormode or 1.0
        vals = [max(0, min(255, int(round(float(v) * 255.0 / mx)))) for v in c[:3]]
        return '#%02x%02x%02x' % tuple(vals)
    return str(c)

class Turtle:
    def __init__(self):
        self.x = 0.0
        self.y = 0.0
        self.heading_deg = 0.0
        self.down = True
        # None means "not chosen" — the canvas picks ink that contrasts with
        # the current background, since real turtle's black would vanish here.
        self._color = None
        self._fill = None
        self._width = 1
        self._speed = 6
        self._filling = False
        self._fillpts = []

    def _delay(self):

// Python emits one write() per fragment — print(a, b) sends "a", " ", "b", "\n"
// separately. The console lays its children out as spaced rows, so fragments

const pyBuf = {out:'', err:''};

// A traceback frame is a `File "..."` line plus the indented lines under it.
// Pyodide's own runner frames are noise between the user and their mistake, but
// the indented lines under the USER's frame are the offending source and the
// caret that points at it — a SyntaxError is unreadable without them. So drop
// by whole frame rather than by line pattern.
const PY_FRAME = /^\s*File "\/lib\/python/;
const ANY_FRAME = /^\s*File "/;
let inNoisyFrame = false;
function isNoise(line){
  if(ANY_FRAME.test(line)){
    inNoisyFrame = PY_FRAME.test(line);
    return inNoisyFrame;
  }
  if(inNoisyFrame){
    // A line at column 0 ends the frame list — that is the exception itself.
    if(/^\S/.test(line)){ inNoisyFrame = false; return false; }
    return true;
  }
  return false;
}
// Point the remaining frames at the user's program instead of "<exec>".
function humanFrame(line){
  return line
    .replace(/^Traceback \(most recent call last\):$/, 'Ошибка при выполнении:')
    .replace(/^\s*File "<exec>", line (\d+), in <module>\s*$/, '  Ваш код, строка $1')
    .replace(/^\s*File "<exec>", line (\d+), in (.+)$/, '  Ваш код, строка $1, в $2')
    .replace(/^\s*File "<exec>", line (\d+)\s*$/, '  Ваш код, строка $1');

    const line = pyBuf[k].slice(0, i);
    pyBuf[k] = pyBuf[k].slice(i + 1);
    if(k === 'err'){
      rawStderr += line + '\n';
      if(isNoise(line)) continue;
      logLine(humanFrame(line), 'line-err');
    } else {
      logLine(line, 'line-out');
    }
  }

// Which lines of `next` have no counterpart in `prev`, via an LCS over whole
// lines. Marking every line from the first difference onward would light up the
// rest of the file after a single inserted line, which tells the reader nothing.
function changedLineNumbers(prev, next){
  const a = prev, b = next, n = a.length, m = b.length;
  const LIMIT = 400;                     // beginner programs; keeps the table small
  if(n > LIMIT || m > LIMIT){
    const out = [];
    for(let j = 0; j < m; j++) if(a[j] !== b[j]) out.push(j);
    return out;
  }
  const dp = [];
  for(let i = 0; i <= n; i++) dp.push(new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--){
    for(let j = m - 1; j >= 0; j--){
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1
                               : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const marked = [];
  let i = 0, j = 0;
  while(i < n && j < m){
    if(a[i] === b[j]){ i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]) i++;   // line removed
    else marked.push(j++);                       // line added or rewritten
  }
  while(j < m) marked.push(j++);
  return marked;
}

async function animateReplace(newFullCode){
  const old = cm.getValue();
  if(old === newFullCode) return;
  let p = 0;
  const maxP = Math.min(old.length, newFullCode.length);
  while(p < maxP && old[p] === newFullCode[p]) p++;
  let sOld = old.length, sNew = newFullCode.length;
  while(sOld > p && sNew > p && old[sOld-1] === newFullCode[sNew-1]){ sOld--; sNew--; }
  const oldMiddleLen = sOld - p;
  const newMiddle = newFullCode.slice(p, sNew);
  const totalChars = oldMiddleLen + newMiddle.length || 1;
  const delay = Math.max(5, Math.min(30, 2000 / totalChars));

  document.getElementById('editor-pane').classList.add('cm-fixing');
  cm.focus();

  for(let remaining = oldMiddleLen; remaining > 0; remaining--){
    const from = cm.posFromIndex(p + remaining - 1);
    const to = cm.posFromIndex(p + remaining);
    cm.replaceRange('', from, to);
    cm.setCursor(from);
    cm.scrollIntoView(from, 80);
    await sleep(delay);
  }
  for(let i = 0; i < newMiddle.length; i++){
    const pos = cm.posFromIndex(p + i);
    cm.replaceRange(newMiddle[i], pos);
    const after = cm.posFromIndex(p + i + 1);
    cm.setCursor(after);
    cm.scrollIntoView(after, 80);
    await sleep(delay);
  }
  document.getElementById('editor-pane').classList.remove('cm-fixing');
}

// Pulls the reply object out of a model that was merely asked for JSON rather
// than constrained to it: unwrap a ``` fence, else scan for the first balanced
// {...} block, ignoring braces that sit inside strings (fixed_code can contain
// them). Returns null when nothing parses.
function extractJson(text){
  let t = String(text).trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence) t = fence[1].trim();
  try{ return JSON.parse(t); }catch(e){}

  const start = t.indexOf('{');
  if(start === -1) return null;
  let depth = 0, inStr = false, esc = false;
  for(let i = start; i < t.length; i++){
    const ch = t[i];
    if(inStr){
      if(esc) esc = false;
      else if(ch === '\\') esc = true;
      else if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"') inStr = true;
    else if(ch === '{') depth++;
    else if(ch === '}' && --depth === 0){
      try{ return JSON.parse(t.slice(start, i + 1)); }catch(e){ return null; }
    }
  }
  return null;
}

// OpenRouter speaks the OpenAI chat-completions shape. `reasoning` and the
// json_schema response format are optional extras: if a provider rejects
// either, retry once without them rather than losing the feature entirely.
async function callOpenRouter(key, baseBody){
  const send = (payload) => fetch(AI_ENDPOINT, {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "Authorization": "Bearer " + key,
      // Optional, used by OpenRouter to attribute traffic to the app.
      "HTTP-Referer": location.origin,
      "X-Title": "Pocket Python"
    },
    body: JSON.stringify(payload)
  });

  // Nothing to gain from another free model when the key itself is the problem.
  const FATAL = [401, 402, 403];
  let lastResp = null;

  for(let i = 0; i < AI_MODELS.length; i++){
    const model = AI_MODELS[i];
    let resp = await send(Object.assign({}, baseBody, {model}));

    // A model that rejects an optional extra gets one retry without it; the
    // system prompt already demands bare JSON, so dropping them is safe.
    if(resp.status === 400){
      const text = await resp.clone().text();
      if(/reasoning|response_format|json_schema|structured/i.test(text)){
        const retry = Object.assign({}, baseBody, {model});
        delete retry.reasoning;
        delete retry.response_format;
        resp = await send(retry);
      }
    }

    if(resp.ok || FATAL.includes(resp.status)) return resp;

    lastResp = resp;
    if(i < AI_MODELS.length - 1){
      logLine(resp.status === 429
        ? 'Лимит бесплатной модели исчерпан, пробую следующую…'
        : 'Модель недоступна (HTTP ' + resp.status + '), пробую следующую…', 'line-sys');
    }
  }
  return lastResp;
}

    if(!resp.ok){
      let detail = 'HTTP ' + resp.status;
      try{
        const err = await resp.json();
        if(err && err.error && err.error.message) detail = err.error.message;
      }catch(e){}
      logLine(resp.status === 401 || resp.status === 403
        ? 'Ключ не принят: ' + detail + ' — нажмите 🔑, чтобы ввести другой.'
        : (resp.status === 429
            ? 'Все бесплатные модели сейчас заняты. Попробуйте через пару минут.'
            : 'ИИ ответил ошибкой: ' + detail), 'line-err');
      return;
    }

    const data = await resp.json();
    // OpenRouter can report a failure inside a 200 response.
    if(data.error){
      logLine('ИИ ответил ошибкой: ' + (data.error.message || 'неизвестная ошибка'),'line-err');
      return;
    }

    const choice = (data.choices || [])[0];
    if(!choice){
      logLine('ИИ вернул пустой ответ.','line-err');
      return;
    }
    if(choice.finish_reason === 'content_filter'){
      logLine('Запрос отклонён фильтром модели.','line-err');
      return;
    }

    const msg = choice.message || {};
    // content is a string in the chat-completions shape, but some providers
    // return the multipart array form.
    const raw = (typeof msg.content === 'string'
      ? msg.content
      : (Array.isArray(msg.content)
          ? msg.content.map(b => (b && b.text) || '').join('')
          : '')).trim();
    const parsed = extractJson(raw)
      || {ok:true, comment: raw || 'Не удалось разобрать ответ.', fixed_code: null};

// ---------- traceback cleanup ----------
// Pyodide prefixes every error with its own frames (/lib/python312.zip, _pyodide);
// a beginner only needs the frame inside their own program.
function cleanTraceback(msg){
  const text = String(msg).replace(/\nPythonError\s*$/,'').trimEnd();
  const lines = text.split('\n');
  const i = lines.findIndex(l => l.includes('File "<exec>"'));
  if(i === -1) return text;
  return ['Traceback (последний вызов):', ...lines.slice(i)].join('\n');
}

// ---------- mobile layout (iPhone / narrow Split View) ----------
const mobileNav = document.getElementById('mobilenav');
const keybar = document.getElementById('keybar');

// The active tab shows the filled Phosphor glyph; that is a different font
// family, so it has to be a class swap rather than CSS.
function paintNav(view){
  mobileNav.querySelectorAll('.navbtn').forEach(b => {
    const on = b.dataset.view === view;
    b.classList.toggle('active', on);
    const ic = b.querySelector('i');
    if(ic){
      ic.classList.toggle('ph', !on);
      ic.classList.toggle('ph-fill', on);
    }
  });
}

function syncMobileNav(which){
  document.body.classList.remove('view-code');
  paintNav(which === 'graphics' ? 'graphics' : 'console');
}

function setView(view){
  if(view === 'code'){
    document.body.classList.add('view-code');
    paintNav('code');
    cm.refresh();
  } else {
    showTab(view === 'graphics' ? 'graphics' : 'console');
  }
}

mobileNav.addEventListener('click', (e) => {
  const btn = e.target.closest('.navbtn');
  if(btn) setView(btn.dataset.view);
});

// The key bar must not steal focus, or iOS dismisses the keyboard on every tap.
keybar.addEventListener('mousedown', (e) => e.preventDefault());
keybar.addEventListener('touchstart', (e) => e.preventDefault(), {passive:false});
keybar.addEventListener('click', (e) => {
  const btn = e.target.closest('.kb');
  if(!btn) return;
  cm.focus();
  const cmd = btn.dataset.cmd;
  if(cmd === 'indent'){
    if(cm.somethingSelected()) cm.execCommand('indentMore');
    else cm.replaceSelection('    ');
  } else if(cmd === 'dedent'){
    cm.execCommand('indentLess');
  } else if(cmd === 'left'){
    cm.execCommand('goCharLeft');
  } else if(cmd === 'right'){
    cm.execCommand('goCharRight');
  } else if(btn.dataset.ins != null){
    cm.replaceSelection(btn.dataset.ins);
  }
});

document.body.classList.add('view-code');
setView('code');
window.addEventListener('orientationchange', () => {
  setTimeout(() => { cm.refresh(); resizeCanvas(); }, 250);
});
